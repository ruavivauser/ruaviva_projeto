name: rua_viva
description: Decentralized check-in for manifestations using Nostr.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  dart_nostr: ^9.2.5
  geolocator: ^14.0.2
  flutter_map: ^7.0.2
  flutter_map_animations: ^0.7.0
  latlong2: ^0.9.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  device_info_plus: ^12.4.0
  crypto: ^3.0.7
  permission_handler: ^12.0.1
  go_router: ^17.1.0
  intl: ^0.20.2
  flutter_map_marker_cluster: ^1.4.0
  flutter_map_heatmap: ^0.0.8
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#006733" # Brazilian Green
  adaptive_icon_foreground: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
